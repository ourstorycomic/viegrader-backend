# =============================================================================
# RUBRIC MẪU: BÀI KIỂM TRA TỰ LUẬN CỦA MÔN HỌC (bậc đại học)
# Dùng cho hệ thống chấm điểm tự động viegrader.
# Giảng viên chỉ cần sửa file YAML này, KHÔNG cần sửa code.
# =============================================================================
rubric_id: bkt_mon_hoc_v1
name: "Rubric chấm bài kiểm tra tự luận môn học"
scale_max: 10.0        # thang điểm tổng
scale_step: 0.25       # điểm tổng được làm tròn về bội của 0.25

meta:
  version: "1.0"
  author: "Nhóm NCKH 2026"
  applies_to: "Câu hỏi tự luận 300–1500 từ, có đề bài kèm theo"
  updated: "2026-08-13"

# -----------------------------------------------------------------------------
# CÁC TIÊU CHÍ CHẤM
# Tổng weight phải bằng 1.0
# -----------------------------------------------------------------------------
criteria:

  - key: noi_dung
    name: "Nội dung kiến thức"
    weight: 0.35
    max_score: 4.0
    description: >
      Mức độ đầy đủ, chính xác của kiến thức môn học; bao phủ các ý cốt lõi mà
      đề bài yêu cầu; sử dụng đúng thuật ngữ chuyên ngành.
    feature_hints: [sim_prompt, keyword_coverage, term_density, content_words]
    levels:
      - name: "Tốt"
        score: 4.0
        descriptor: "Bao phủ ≥85% ý cốt lõi, kiến thức chính xác, thuật ngữ dùng đúng và nhất quán."
        indicators: ["keyword_coverage >= 0.85", "không có lỗi kiến thức nghiêm trọng"]
      - name: "Khá"
        score: 3.0
        descriptor: "Bao phủ 65–85% ý cốt lõi, còn thiếu ý phụ hoặc diễn giải chưa sâu."
        indicators: ["keyword_coverage 0.65–0.85"]
      - name: "Đạt"
        score: 2.0
        descriptor: "Bao phủ 40–65% ý cốt lõi, có sai sót nhỏ về kiến thức."
        indicators: ["keyword_coverage 0.40–0.65"]
      - name: "Chưa đạt"
        score: 1.0
        descriptor: "Bao phủ <40% ý cốt lõi, nhiều sai sót kiến thức."
        indicators: ["keyword_coverage < 0.40"]
      - name: "Không tính điểm"
        score: 0.0
        descriptor: "Bỏ trống, lạc đề hoàn toàn, hoặc chép nguyên văn đề bài."

  - key: lap_luan
    name: "Lập luận và tổ chức ý"
    weight: 0.25
    max_score: 3.0
    description: >
      Bài có luận điểm rõ ràng; lí lẽ và dẫn chứng hỗ trợ luận điểm; bố cục
      mở – thân – kết mạch lạc; các đoạn liên kết logic.
    feature_hints: [n_paragraphs, connective_density, argument_markers, structure_score]
    levels:
      - name: "Tốt"
        score: 3.0
        descriptor: "Luận điểm rõ, mỗi đoạn một ý, có dẫn chứng/lí lẽ thuyết phục, kết luận chốt được vấn đề."
      - name: "Khá"
        score: 2.25
        descriptor: "Có bố cục và luận điểm nhưng một vài đoạn còn lan man hoặc thiếu dẫn chứng."
      - name: "Đạt"
        score: 1.5
        descriptor: "Ý rời rạc, bố cục mờ nhạt, chủ yếu liệt kê chưa phân tích."
      - name: "Chưa đạt"
        score: 0.75
        descriptor: "Không có bố cục, không phân biệt được luận điểm và dẫn chứng."
      - name: "Không tính điểm"
        score: 0.0
        descriptor: "Bài quá ngắn hoặc không thành đoạn văn."

  - key: dien_dat
    name: "Diễn đạt và ngôn ngữ"
    weight: 0.20
    max_score: 2.0
    description: >
      Dùng từ chính xác, câu đúng ngữ pháp, văn phong học thuật, hạn chế lỗi
      chính tả và lỗi dấu câu.
    feature_hints: [spell_error_rate, ttr, mean_sentence_len, punct_error_rate, informal_rate]
    levels:
      - name: "Tốt"
        score: 2.0
        descriptor: "Hầu như không lỗi chính tả/ngữ pháp (<1%), từ vựng phong phú, văn phong học thuật."
        indicators: ["spell_error_rate < 0.01", "informal_rate < 0.005"]
      - name: "Khá"
        score: 1.5
        descriptor: "Một vài lỗi nhỏ (1–3%), không cản trở việc hiểu."
        indicators: ["spell_error_rate 0.01–0.03"]
      - name: "Đạt"
        score: 1.0
        descriptor: "Lỗi xuất hiện thường xuyên (3–6%), câu dài lủng củng, còn dùng văn nói."
      - name: "Chưa đạt"
        score: 0.5
        descriptor: "Lỗi dày đặc (>6%), nhiều câu tối nghĩa."
      - name: "Không tính điểm"
        score: 0.0
        descriptor: "Không đọc hiểu được."

  - key: hinh_thuc
    name: "Hình thức và tính liêm chính"
    weight: 0.20
    max_score: 1.0
    description: >
      Trình bày đúng yêu cầu về độ dài, định dạng; có trích dẫn nguồn khi cần;
      bài làm là sản phẩm độc lập của người học.
    feature_hints: [n_words, has_citation, dup_ratio, ai_style_score]
    levels:
      - name: "Tốt"
        score: 1.0
        descriptor: "Đúng độ dài quy định, trình bày sạch, có trích dẫn nguồn hợp lệ, không trùng lặp."
      - name: "Khá"
        score: 0.75
        descriptor: "Đạt yêu cầu cơ bản, trích dẫn chưa đầy đủ hoặc trình bày còn cẩu thả."
      - name: "Đạt"
        score: 0.5
        descriptor: "Thiếu/thừa độ dài đáng kể hoặc không trích dẫn khi có dùng nguồn."
      - name: "Chưa đạt"
        score: 0.25
        descriptor: "Vi phạm nhiều yêu cầu hình thức."
      - name: "Không tính điểm"
        score: 0.0
        descriptor: "Nghi vấn sao chép/gian lận, cần chuyển giám khảo xử lí."

# -----------------------------------------------------------------------------
# QUY ĐỊNH CHẤM TỰ ĐỘNG (RULE ENGINE)
# Thứ tự thi hành: theo thứ tự khai báo. Mỗi rule có:
#   when   : biểu thức Python an toàn trên các biến đặc trưng/điểm
#   action : cap_total | set_criterion | subtract | flag | review | stop
# -----------------------------------------------------------------------------
rules:

  - id: R01_bai_trong
    description: "Bài trống hoặc dưới 20 từ -> 0 điểm toàn bài."
    when: "n_words < 20"
    action: cap_total
    value: 0.0
    flag: "BAI_TRONG"
    stop: true

  - id: R02_lac_de
    description: "Độ tương đồng ngữ nghĩa với đề bài quá thấp -> nghi ngờ lạc đề, chuyển giám khảo."
    when: "sim_prompt < 0.15 and n_words >= 20"
    action: review
    flag: "NGHI_LAC_DE"
    reason: "Nội dung có thể không bám đề bài"

  - id: R03_chep_de
    description: "Chép lại đề bài chiếm >60% nội dung -> nội dung = 0."
    when: "prompt_copy_ratio > 0.60"
    action: set_criterion
    target: noi_dung
    value: 0.0
    flag: "CHEP_DE_BAI"

  - id: R04_qua_ngan
    description: "Bài dưới 50% độ dài tối thiểu -> trần điểm tổng 50%."
    when: "n_words < 0.5 * min_words"
    action: cap_total
    value_expr: "0.5 * scale_max"
    flag: "QUA_NGAN"

  - id: R05_trung_lap
    description: "Trùng lặp cao với bài khác trong cùng lớp -> chuyển xử lí liêm chính học thuật."
    when: "dup_ratio >= 0.80"
    action: review
    flag: "NGHI_SAO_CHEP"
    reason: "Trùng lặp nội bộ vượt ngưỡng"

  - id: R06_loi_chinh_ta_nang
    description: "Tỉ lệ lỗi chính tả trên 15% -> trừ tối đa 0.5 điểm tổng."
    when: "spell_error_rate > 0.15"
    action: subtract
    value: 0.5
    flag: "LOI_CHINH_TA_NANG"

  - id: R07_do_tin_cay_thap
    description: "Mô hình thiếu tự tin -> phúc tra thủ công."
    when: "confidence < 0.50"
    action: review
    reason: "Độ tin cậy dự đoán thấp"

  - id: R07b_nam_ranh_gioi_muc
    description: "Điểm thô nằm đúng ranh giới giữa hai mức rubric -> phúc tra."
    when: "max_snap_gap > 0.90"
    action: review
    reason: "Điểm nằm giữa hai mức rubric, việc neo mức là tuỳ tiện"

  - id: R08_diem_ranh_gioi
    description: "Điểm rơi sát ngưỡng đạt (4.75–5.25) -> phúc tra thủ công."
    when: "4.75 <= total <= 5.25"
    action: review
    reason: "Điểm nằm sát ngưỡng đạt/không đạt"

# -----------------------------------------------------------------------------
# THAM SỐ NGƯỠNG dùng trong rule (giảng viên chỉnh theo từng đề)
# -----------------------------------------------------------------------------
thresholds:
  min_words: 300
  max_words: 1500
  review_rate_target: 0.15   # tỉ lệ bài chuyển phúc tra mục tiêu
